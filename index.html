<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-inner">
        <h1 class="logo">tasks.</h1>
        <time class="today" id="today"></time>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="main">

      <!-- Add task -->
      <section class="add-section" aria-label="Add new task">
        <div class="input-row">
          <input
            id="task-input"
            class="task-input"
            type="text"
            placeholder="What needs doing?"
            autocomplete="off"
            aria-label="New task title"
            maxlength="200"
          />
          <button id="add-btn" class="add-btn" aria-label="Add task">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <line x1="9" y1="2" x2="9" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="2" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="meta-row">
          <input
            id="category-input"
            class="meta-input"
            type="text"
            placeholder="Category"
            aria-label="Category (optional)"
            maxlength="40"
          />
          <input
            id="due-date-input"
            class="meta-input meta-input--date"
            type="date"
            aria-label="Due date (optional)"
          />
        </div>
      </section>

      <!-- Filters + count -->
      <div class="toolbar">
        <nav class="filters" aria-label="Task filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </nav>
        <span class="task-count" id="task-count" aria-live="polite"></span>
      </div>

      <!-- Task list -->
      <ul class="task-list" id="task-list" aria-label="Task list" role="list"></ul>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-check" aria-hidden="true">✓</div>
        <p class="empty-heading">All clear.</p>
        <p class="empty-sub">Add a task above to get started.</p>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
